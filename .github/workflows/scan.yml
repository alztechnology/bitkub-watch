name: scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan.py
      - name: Commit data
        run: |
          git config user.name "bitkub-watch-bot"
          git config user.email "bitkub-watch-bot@users.noreply.github.com"
          git add data.json mcap_cache.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push
